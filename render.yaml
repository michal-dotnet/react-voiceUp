# Render Blueprint for VoiceUp: PostgreSQL + API (Express) + static frontend (Vite).
# Create it in Render: New > Blueprint > choose this repository.

databases:
  - name: voiceup-db
    plan: free
    region: frankfurt
    databaseName: voiceup
    user: voiceup

services:
  # --- Backend API ---
  - type: web
    name: voiceup-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: voiceup-backend
    buildCommand: npm ci --include=dev && npm run build
    # Free instances have no pre-deploy step, so migrations and the (idempotent) seed run on start.
    startCommand: npm run db:deploy && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: voiceup-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The frontend address, e.g. https://voiceup-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # The first admin account (created by the seed on start).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: VoiceUp Admin

  # --- Frontend (static site) ---
  - type: web
    name: voiceup-web
    runtime: static
    branch: main
    rootDir: voiceup-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API address including /api, e.g. https://voiceup-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
